apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-argocd
  namespace: argocd
spec:
  project: default
  source:
    chart: karpenter
    repoURL: public.ecr.aws/karpenter
    targetRevision: 1.0.14
    helm:
      releaseName: karpenter
      # The CRDs come from the karpenter-crd-argocd app
      skipCrds: true
      values: |
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::824841205322:role/KarpenterControllerRole-dissco-k8s-test
        settings:
          clusterName: dissco-k8s-test
        dnsPolicy: ClusterFirst
        # Serves the v1beta1 <-> v1 conversion webhook during the v1 migration
        webhook:
          enabled: true
          port: 8443
  destination:
    server: "https://kubernetes.default.svc"
    namespace: karpenter
  # The Karpenter controller injects the CA of its webhooks
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
