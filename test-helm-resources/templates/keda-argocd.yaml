apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-argocd
  namespace: argocd
spec:
  project: default
  source:
    chart: keda
    repoURL: https://kedacore.github.io/charts
    targetRevision: 2.21.1
    helm:
      releaseName: keda
      values: |
        crds:
          additionalAnnotations:
            # The scaledjobs CRD (~320KB) is too large for the 256KB last-applied annotation of a normal apply.
            # Replace updates the CRDs in place (kubectl replace) without that annotation. Not ServerSideApply
            # for the whole app: ArgoCD v2.5 cannot diff fields of newer Kubernetes versions with it.
            argocd.argoproj.io/sync-options: Replace=true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: keda