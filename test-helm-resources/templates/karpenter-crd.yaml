apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-crd-argocd
  namespace: argocd
spec:
  project: default
  source:
    # The Karpenter CRDs have their own chart: the CRDs in the main chart hardcode the conversion
    # webhook to the kube-system namespace, and Karpenter runs in the karpenter namespace.
    chart: karpenter-crd
    repoURL: public.ecr.aws/karpenter
    targetRevision: 0.35.12
    helm:
      releaseName: karpenter-crd
      values: |
        # Conversion webhook between v1beta1 and v1, needed during the v1 migration (0.35.12 and 1.0.x)
        webhook:
          enabled: true
          serviceName: karpenter
          port: 8443
  destination:
    server: "https://kubernetes.default.svc"
    namespace: karpenter
  # The Karpenter controller injects the CA of its webhook into the CRDs
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
