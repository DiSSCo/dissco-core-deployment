apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-argocd
  namespace: argocd
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.3
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          # Never delete the CRDs (and with them every Certificate and Issuer) when the app is removed
          keep: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cert-manager
