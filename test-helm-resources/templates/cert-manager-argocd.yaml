apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-argocd
  namespace: argocd
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    # Upgrade one minor version at a time (cert-manager's advice), using the latest patch of each:
    # v1.15.5 -> v1.16.5 -> v1.17.4 -> v1.18.6 -> v1.19.6 (never v1.19.0) -> v1.20.5 -> v1.21.3
    targetRevision: v1.18.6
    helm:
      # Same release name as the original static install, so all object names stay the same
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          # Never delete the CRDs (and with them every Certificate and Issuer) when the app is removed
          keep: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cert-manager
