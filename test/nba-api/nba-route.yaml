apiVersion: v1
kind: Service
metadata:
  name: nba-api-service
  namespace: nba
spec:
  selector:
    app: nba-api-deployment
  ports:
    - protocol: TCP
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nba-route
  namespace: nba
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nba.dev.dissco.tech`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: nba-api-service
          namespace: default
          port: 8080