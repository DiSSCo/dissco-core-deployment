apiVersion: apps/v1
kind: Deployment
metadata:
  name: dissco-nu-search-deployment
  labels:
    app: dissco-nu-search-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dissco-nu-search-deployment
  template:
    metadata:
      labels:
        app: dissco-nu-search-deployment
        language: java
    spec:
      automountServiceAccountToken: true
      serviceAccountName: nu-search-sa
      containers:
        - name: dissco-nu-search-deployment
          image: public.ecr.aws/dissco/dissco-nusearch-service:latest
          imagePullPolicy: Always
          env:
            - name: spring.rabbitmq.password
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: rabbitmq-password
            - name: spring.rabbitmq.username
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: rabbitmq-username
            - name: spring.rabbitmq.host
              value: rabbitmq-cluster.rabbitmq.svc.cluster.local
            - name: rabbitmq.exchange-name
              value: virtual-collection-ingestion-exchange
            - name: rabbitmq.routing-key-name
              value: virtual-collection-ingestion
            - name: matching-api.endpoint
              value: http://col-matching-ws-service.default.svc.cluster.local:8080
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "1Gi"
              cpu: "500m"
              ephemeral-storage: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: aws-secrets
              mountPath: "/mnt/secrets-store/aws-secrets"
              readOnly: true
      volumes:
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "aws-secrets"
