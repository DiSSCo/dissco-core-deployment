apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq-cluster
  namespace: rabbitmq
  annotations:
    rabbitmq.com/topology-allowed-namespaces: "machine-annotation-services"
spec:
  replicas: 3
  image: rabbitmq:4.4.1-management
  resources:
    requests:
      memory: 4Gi
    limits:
      memory: 4Gi
  rabbitmq:
    additionalPlugins:
      - rabbitmq_management
      - rabbitmq_shovel
      - rabbitmq_shovel_management
      - rabbitmq_prometheus
  persistence:
    storageClassName: gp3
    storage: "100Gi"
